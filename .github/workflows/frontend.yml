name: Frontend build and API compatibility

on: [push, pull_request]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - run: npm ci
      - name: Generate API client and build production bundle
        run: npm run build
      - name: Check request mapping and saved contract compatibility
        env:
          TZ: Europe/Berlin
        run: npm test -- --watch=false --browsers=ChromeHeadless --include=src/app/pages/plain-swap-editor/plain-swap-editor-form/plain-swap-editor-form.component.spec.ts
