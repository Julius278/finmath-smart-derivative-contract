name: Legacy snapshot publishing (manual)

# Publishing remains manual while the snapshot repository is being migrated.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bCP1ld:
    name: SNAPSHOT, build and upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
      - name: upload SNAPSHOT to GitLab
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_TOKEN }}
        run: mvn -s github_SNAPSHOT_settings.xml clean install deploy
