name: Java and legacy Solidity tests

on: [ push, pull_request ]

permissions:
  contents: read

jobs:
  bCP1ld:
    name: Java 17 build and unit testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
      - name: Build with Maven
        run: mvn -B package --file pom.xml

  legacy-solidity:
    name: Legacy Solidity build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solidity/derivatives
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Retain the runtime supported by the existing Hardhat 2.12 lockfile.
          node-version: 16
          cache: npm
          cache-dependency-path: solidity/derivatives/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
