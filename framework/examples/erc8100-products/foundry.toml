[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
via_ir = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./resources" }]
remappings = ["@openzeppelin/=node_modules/@openzeppelin/", "solady/=node_modules/solady/src/"]

[fmt]
line_length = 100
